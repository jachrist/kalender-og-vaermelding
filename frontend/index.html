<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6f4f" />
  <title>Hytteportal</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Innloggingsskjerm -->
  <div id="login" hidden></div>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar__inner">
        <span class="brand">🏔️ Hytteportal</span>
        <div class="topbar__right">
          <select id="cabin-picker" class="cabin-picker" aria-label="Velg hytte"></select>
          <button id="user-btn" class="user-btn" aria-label="Bruker og utlogging"></button>
        </div>
      </div>
    </header>

    <main class="content" id="content"></main>

    <nav class="tabbar" id="tabbar" role="tablist"></nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
