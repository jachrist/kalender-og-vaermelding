# Deploy av Hytteportal til Azure App Service (Linux, Node).
#
# Vi deployer api/-mappa som app-rot og lar App Service (Oryx) kjøre `npm install`
# på serveren. Da bygges/hentes den native modulen better-sqlite3 for NØYAKTIG den
# Node-versjonen App Service kjører — så vi unngår ABI-mismatch (som oppstår hvis
# binæren bygges på GitHub-runneren og kjøres på en annen Node på App Service).
#
# Engangsoppsett før første deploy:
#   1. Opprett en App Service (Linux, runtime "Node 20 LTS"), gjerne på Free (F1).
#   2. App Service -> Configuration -> Application settings:
#        SQLITE_DB_PATH = /home/data/hytteportal.db   (vedvarende /home-disk)
#        UPLOAD_DIR     = /home/data/uploads          (vedvarende /home-disk)
#        SCM_DO_BUILD_DURING_DEPLOYMENT = true         (la Oryx bygge på serveren)
#        ADMIN_EMAIL, ADMIN_NAME
#        TENANT_ID, GRAPH_CLIENT_ID, GRAPH_CLIENT_SECRET, MAIL_SENDER  (for e-post)
#   3. General settings -> Startup Command:  node server.js
#      (api/ er app-rot, så server.js ligger på rota av wwwroot.)
#   4. Last ned publish profile (App Service -> "Get publish profile") og legg
#      innholdet som repo-secret AZURE_WEBAPP_PUBLISH_PROFILE.
#   5. Sett app-navnet under 'env.AZURE_WEBAPP_NAME' nedenfor.

name: Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: hytteapp

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bunt frontend inn i api/ så hele appen (API + statiske filer) deployes
      # fra én app-rot. server.js foretrekker api/frontend når den finnes.
      - name: Bunt frontend inn i api/
        run: cp -r frontend api/frontend

      # Deploy api/-mappa (uten node_modules) — Oryx kjører npm install på serveren.
      - name: Deploy til Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api
