# Deploy av Hytteportal til Azure App Service (Linux, Node).
#
# Engangsoppsett før første deploy:
#   1. Opprett en App Service (Linux, runtime "Node 20 LTS"), gjerne på Free (F1).
#   2. App Service -> Configuration -> Application settings:
#        SQLITE_DB_PATH = /home/data/hytteportal.db   (vedvarende /home-disk)
#        UPLOAD_DIR     = /home/data/uploads          (vedvarende /home-disk)
#        ADMIN_EMAIL, ADMIN_NAME
#        TENANT_ID, GRAPH_CLIENT_ID, GRAPH_CLIENT_SECRET, MAIL_SENDER  (for e-post)
#   3. General settings -> Startup Command:  node api/server.js
#      (package.json ligger i api/, mens frontend/ serveres relativt derfra.)
#   4. Last ned publish profile (App Service -> "Get publish profile") og legg
#      innholdet som repo-secret AZURE_WEBAPP_PUBLISH_PROFILE.
#   5. Sett app-navnet under 'env.AZURE_WEBAPP_NAME' nedenfor.
#
# Denne workflowen bygger api/node_modules (inkl. better-sqlite3) på GitHub-runneren
# — begge er Linux x64 / Node 20, så den kompilerte binæren kjører på App Service.
# Hele repoet (med api/node_modules og frontend/) pakkes og lastes opp.

name: Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: hytteapp
  NODE_VERSION: "20"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installer avhengigheter
        working-directory: api
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Deploy til Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
